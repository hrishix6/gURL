services:
  db:
    container_name: gurl-web-db
    image: ${POSTGRES_IMAGE}
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - gurl-web-public-db:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    env_file:
      - .env.local
    networks:
      - gurl-web-public-network
  gurl:
    depends_on:
      db:
        condition: service_healthy
        restart: true
    container_name: gurl-web-container
    image: gurl-web 
    build: Dockerfile.public
    networks:
      -  gurl-web-public-network
    volumes:
      - ./appData:/usr/local/src/gURL
      
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    depends_on:
      - gurl
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      -  gurl-web-public-network

volumes:
  gurl-web-public-db:
    driver: local

networks:
  gurl-web-public-network:
    driver: bridge